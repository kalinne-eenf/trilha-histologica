<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de moderador | Trilha Histológica</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; background: #f5f7f6; color: #20302b; font-family: Arial, sans-serif; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 28px; border-radius: 16px; box-shadow: 0 8px 28px rgba(20,50,40,.08); }
    h1 { margin: 0 0 8px; font-size: 27px; }
    .subtitle { margin: 0 0 22px; color: #53645d; }
    .notice { background: #eef5f1; border-radius: 10px; padding: 13px 15px; line-height: 1.5; margin-bottom: 22px; }
    label { display: block; font-weight: 700; margin: 15px 0 7px; }
    input { width: 100%; padding: 13px 12px; border: 1px solid #cbd5d0; border-radius: 9px; font-size: 16px; }
    input:focus { outline: 2px solid #9bc8b4; border-color: #27805d; }
    button { width: 100%; margin-top: 22px; padding: 14px; border: 0; border-radius: 9px; background: #187a58; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    #status { margin-top: 17px; line-height: 1.5; white-space: pre-wrap; }
    .small { color: #68766f; font-size: 13px; margin-top: 18px; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <h1>Cadastro de moderador</h1>
  <p class="subtitle">Trilha Histológica</p>
  <div class="notice">Esta página é destinada somente a pessoas que receberam um código de convite da administradora. O código é de uso único e tem prazo de validade.</div>

  <form id="signupForm">
    <label for="display_name">Nome completo</label>
    <input id="display_name" name="display_name" autocomplete="name" minlength="2" maxlength="80" required>

    <label for="email">E-mail convidado</label>
    <input id="email" name="email" type="email" autocomplete="email" required>

    <label for="password">Criar senha</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>

    <label for="password_confirm">Confirmar senha</label>
    <input id="password_confirm" name="password_confirm" type="password" autocomplete="new-password" minlength="8" required>

    <label for="token">Código do convite</label>
    <input id="token" name="token" autocomplete="off" spellcheck="false" required>

    <button id="submitButton" type="submit">Criar minha conta de moderador</button>
  </form>

  <div id="status" role="status" aria-live="polite"></div>
  <p class="small">Nunca informe aqui a senha da administradora. A pessoa convidada deve criar sua própria senha.</p>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://ydtgkvpjgnpkymtagyvn.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wboBHHFMup6x52H0taiBwQ_ATaMjxSv";

  const form = document.getElementById("signupForm");
  const button = document.getElementById("submitButton");
  const status = document.getElementById("status");

  if (!window.supabase || !window.supabase.createClient) {
    status.textContent = "Não foi possível carregar a biblioteca de autenticação. Verifique sua conexão e tente novamente.";
    button.disabled = true;
    return;
  }

  const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
    auth: { autoRefreshToken: false, persistSession: false, detectSessionInUrl: false }
  });

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    status.textContent = "";

    const display_name = document.getElementById("display_name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const password_confirm = document.getElementById("password_confirm").value;
    const token = document.getElementById("token").value.trim();

    if (password !== password_confirm) {
      status.textContent = "As senhas não coincidem. Confira os dois campos.";
      return;
    }
    if (password.length < 8) {
      status.textContent = "A senha precisa ter pelo menos 8 caracteres.";
      return;
    }

    button.disabled = true;
    button.textContent = "Validando convite...";

    try {
      const { data, error } = await client.functions.invoke("redeem-moderator-invite", {
        body: { email, password, display_name, token }
      });

      if (error) {
        let details = "";
        try {
          if (error.context && typeof error.context.json === "function") {
            const payload = await error.context.json();
            details = payload?.error || payload?.message || "";
          }
        } catch (_) {}
        throw new Error(details || error.message || "Não foi possível concluir o cadastro.");
      }

      status.textContent = data?.message || "Cadastro concluído! Sua conta de moderador foi criada. Você já pode acessar a página de login da Trilha Histológica.";
      form.reset();
    } catch (err) {
      status.textContent = "Não foi possível concluir o cadastro: " + (err.message || "erro inesperado") +
        "\nConfira se o e-mail é o mesmo que recebeu o convite, se o código está completo e se ainda está dentro do prazo.";
    } finally {
      button.disabled = false;
      button.textContent = "Criar minha conta de moderador";
    }
  });
})();
</script>
</body>
</html>
