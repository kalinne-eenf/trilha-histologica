<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilha Histológica — Recuperar senha</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;padding:28px;font-family:Arial,sans-serif;background:#f5f3ef;color:#292722}
  main{max-width:540px;margin:6vh auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 4px 24px #0001}
  h1{font-size:24px;margin:0 0 10px}
  p{color:#5d5a54;line-height:1.5}
  label{display:block;font-weight:600;margin:18px 0 7px}
  input{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;font-size:16px}
  button{margin-top:20px;padding:13px 18px;background:#167a59;color:#fff;border:0;border-radius:8px;font-size:15px;cursor:pointer}
  button:disabled{opacity:.55;cursor:wait}
  .note{font-size:13px;background:#f4f7f5;padding:12px;border-radius:8px}
  #status{margin-top:18px;white-space:pre-wrap;line-height:1.5}
  .hidden{display:none}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main>
  <h1>Recuperar senha</h1>
  <p>Trilha Histológica</p>
  <p class="note">Use esta página para solicitar um link de recuperação ou cadastrar uma nova senha depois de abrir o link recebido por e-mail.</p>

  <section id="requestSection">
    <h2>Solicitar link</h2>
    <label for="email">E-mail da sua conta</label>
    <input id="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com">
    <button id="sendButton">Enviar link de recuperação</button>
  </section>

  <section id="passwordSection" class="hidden">
    <h2>Criar nova senha</h2>
    <label for="password">Nova senha (mínimo de 8 caracteres)</label>
    <input id="password" type="password" autocomplete="new-password">
    <label for="confirmPassword">Confirmar nova senha</label>
    <input id="confirmPassword" type="password" autocomplete="new-password">
    <button id="saveButton">Salvar nova senha</button>
  </section>

  <div id="status" role="status" aria-live="polite"></div>
</main>

<script>
(() => {
  const SUPABASE_URL = "https://ydtgkvpjgnpkymtagyvn.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_wboBHHFMup6x52H0taiBwQ_ATaMjxSv";

  const $ = (id) => document.getElementById(id);
  const status = (message) => { $("status").textContent = message; };

  if (!window.supabase) {
    status("Não foi possível carregar a biblioteca de autenticação. Verifique sua conexão e recarregue a página.");
    return;
  }

  if (SUPABASE_PUBLISHABLE_KEY === "COLE_SUA_PUBLISHABLE_KEY_AQUI") {
    status("A página ainda precisa da Publishable key do projeto. Edite este arquivo no GitHub e substitua o texto indicado no código.");
    return;
  }

  const client = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    { auth: { flowType: "implicit", detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } }
  );

  function showPasswordForm() {
    $("requestSection").classList.add("hidden");
    $("passwordSection").classList.remove("hidden");
    status("Link reconhecido. Escolha sua nova senha.");
  }

  client.auth.onAuthStateChange((event, session) => {
    if ((event === "PASSWORD_RECOVERY" || session) && session) {
      showPasswordForm();
    }
  });

  client.auth.getSession().then(({ data, error }) => {
    if (error) {
      status("Não foi possível validar o link. Solicite um novo link de recuperação.");
      return;
    }
    if (data.session) showPasswordForm();
  });

  $("sendButton").addEventListener("click", async () => {
    const email = $("email").value.trim();
    if (!email) { status("Informe o e-mail da sua conta."); return; }

    $("sendButton").disabled = true;
    status("Enviando solicitação…");
    try {
      const redirectTo = window.location.origin + window.location.pathname;
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo });
      if (error) throw error;
      status("Se esse e-mail estiver cadastrado, você receberá uma mensagem com o link para criar uma nova senha. Confira também o spam.");
    } catch (error) {
      status("Não foi possível solicitar a recuperação: " + (error.message || "erro desconhecido"));
    } finally {
      $("sendButton").disabled = false;
    }
  });

  $("saveButton").addEventListener("click", async () => {
    const password = $("password").value;
    const confirmation = $("confirmPassword").value;
    if (password.length < 8) { status("A senha precisa ter pelo menos 8 caracteres."); return; }
    if (password !== confirmation) { status("As senhas não coincidem."); return; }

    $("saveButton").disabled = true;
    status("Salvando nova senha…");
    try {
      const { error } = await client.auth.updateUser({ password });
      if (error) throw error;
      await client.auth.signOut();
      $("passwordSection").classList.add("hidden");
      status("Senha alterada com sucesso! Agora você pode voltar à página de convites e entrar com a nova senha.");
    } catch (error) {
      status("Não foi possível alterar a senha: " + (error.message || "link inválido ou expirado. Solicite outro link."));
    } finally {
      $("saveButton").disabled = false;
    }
  });
})();
</script>
</body>
</html>
